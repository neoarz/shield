name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Validate package contents
        run: npm pack --dry-run

  node:
    name: Node ${{ matrix.node }} smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build with the runner's Node; only the built package runs on the
      # matrix version.
      - name: Build
        run: bun run build

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Smoke test the built package
        run: node scripts/smoke-dist.mjs
